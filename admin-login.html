<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Special Fare</title>
  <link rel="stylesheet" href="css/index.css?v=1.1.9" />
  <style>
    .admin-badge-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 32px rgba(14, 165, 233, 0.4);
    }
    .demo-hint {
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(14, 165, 233, 0.3);
      border-radius: 12px;
      padding: 0.85rem 1.25rem;
      margin-top: 1.25rem;
      font-size: 0.82rem;
      color: var(--text-secondary);
      text-align: center;
    }
    .demo-hint strong { color: var(--accent-primary); }
    .demo-hint code {
      background: rgba(255,255,255,0.08);
      padding: 2px 8px;
      border-radius: 6px;
      font-family: monospace;
      color: var(--text-primary);
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-muted);
      font-size: 0.88rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent-primary); }
    .back-link span { margin-right: 6px; }
    .input-icon-wrapper { position: relative; }
    .input-icon-wrapper .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
    }
    .input-icon-wrapper .form-control { padding-left: 42px; }
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      font-size: 1rem;
      transition: color 0.2s;
    }
    .toggle-password:hover { color: var(--text-primary); }
    .auth-card { max-width: 440px; }
    .admin-warning {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.82rem;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card card-glass animate-fadeInUp">
      <div class="admin-badge-icon">⚙️</div>

      <h1 class="auth-title">Admin Login</h1>
      <p style="text-align:center;color:var(--text-muted);font-size:0.9rem;margin-bottom:1.75rem;">
        Restricted access — Special Fare Control Panel
      </p>

      <div class="admin-warning">
        <span>🔒</span>
        <span>This area is restricted to authorized administrators only. Unauthorized access is prohibited.</span>
      </div>

      <form id="adminLoginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-icon-wrapper">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="username"
              class="form-control"
              placeholder="Enter admin username"
              autocomplete="username"
              autofocus
            />
          </div>
          <div class="form-error" id="usernameError"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-icon-wrapper">
            <span class="input-icon">🔑</span>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Enter password"
              autocomplete="current-password"
            />
            <button type="button" class="toggle-password" id="togglePwd" title="Toggle password visibility">👁️</button>
          </div>
          <div class="form-error" id="passwordError"></div>
        </div>

        <div class="form-error" id="formError" style="margin-bottom:0.75rem;text-align:center;"></div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:0.5rem;" id="loginBtn">
          <span id="loginBtnText">Login to Admin Panel</span>
          <span id="loginBtnSpinner" class="spinner" style="display:none;width:18px;height:18px;border-width:2px;"></span>
        </button>
      </form>


      <a href="index.html" class="back-link">
        <span>✈</span>Back to Special Fare Home
      </a>
    </div>
  </div>

  <script src="js/data.js?v=1.1.9"></script>
  <script src="js/storage.js?v=1.1.9"></script>
  <script src="js/utils.js?v=1.1.9"></script>
  <script>
    // If already logged in as admin, redirect
    (function () {
      const session = Storage.getSession();
      if (session && session.role === 'admin') {
        window.location.href = 'admin-dashboard.html';
      }
    })();

    // Toggle password visibility
    document.getElementById('togglePwd').addEventListener('click', function () {
      const pwd = document.getElementById('password');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        this.textContent = '🙈';
      } else {
        pwd.type = 'password';
        this.textContent = '👁️';
      }
    });

    // Form submission
    document.getElementById('adminLoginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      let valid = true;

      // Clear errors
      document.getElementById('usernameError').textContent = '';
      document.getElementById('passwordError').textContent = '';
      document.getElementById('formError').textContent = '';
      document.getElementById('username').classList.remove('error');
      document.getElementById('password').classList.remove('error');

      if (!username) {
        document.getElementById('usernameError').textContent = 'Username is required.';
        document.getElementById('username').classList.add('error');
        valid = false;
      }
      if (!password) {
        document.getElementById('passwordError').textContent = 'Password is required.';
        document.getElementById('password').classList.add('error');
        valid = false;
      }
      if (!valid) return;

      // Show loading state
      document.getElementById('loginBtnText').textContent = 'Authenticating...';
      document.getElementById('loginBtnSpinner').style.display = 'inline-block';
      document.getElementById('loginBtn').disabled = true;

      // Attempt login (slight delay for UX)
      setTimeout(function () {
        const result = Storage.login(username, password, 'admin');

        if (result.success) {
          Utils.showToast('Welcome, Administrator! Redirecting...', 'success');
          setTimeout(function () {
            window.location.href = 'admin-dashboard.html';
          }, 800);
        } else {
          document.getElementById('formError').textContent = 'Invalid username or password. Please try again.';
          document.getElementById('username').classList.add('error');
          document.getElementById('password').classList.add('error');
          document.getElementById('password').value = '';

          document.getElementById('loginBtnText').textContent = 'Login to Admin Panel';
          document.getElementById('loginBtnSpinner').style.display = 'none';
          document.getElementById('loginBtn').disabled = false;

          Utils.showToast('Invalid credentials', 'error');
        }
      }, 600);
    });

    // Enter key on username field
    document.getElementById('username').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        document.getElementById('password').focus();
      }
    });
  </script>
</body>
</html>
